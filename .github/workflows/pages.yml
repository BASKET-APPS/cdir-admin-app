name: Deploy administration demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build isolated showcase with synthetic data
        run: node --import tsx scripts/build-pages-demo.mts
        env:
          NODE_OPTIONS: --max-old-space-size=1536
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-demo/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
